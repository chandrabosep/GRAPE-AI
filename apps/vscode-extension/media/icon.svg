<!-- The bunch, drawn in the same idiom as the sparkle it replaces: one stroke
     weight, currentColor, round joins — so VS Code themes and masks it the way
     it did before. Six berries rather than a realistic dozen, because the
     activity bar renders this at 24px and anything smaller than ~4px of hole
     closes up into a blob. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 7.9V4.6"/>
  <path d="M12 4.6c1.4-1.8 3.4-2.4 5.2-1.6-.2 2-2 3.4-4 3.2z"/>
  <circle cx="7.2" cy="10.2" r="2.3"/>
  <circle cx="12" cy="10.2" r="2.3"/>
  <circle cx="16.8" cy="10.2" r="2.3"/>
  <circle cx="9.6" cy="14.6" r="2.3"/>
  <circle cx="14.4" cy="14.6" r="2.3"/>
  <circle cx="12" cy="19" r="2.3"/>
</svg>
