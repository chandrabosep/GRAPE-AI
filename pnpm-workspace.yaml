packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks postinstall scripts unless explicitly allowed.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - sharp
  - unrs-resolver

# Let pnpm rebuild node_modules without a prompt when hoisting settings change.
confirmModulesPurge: false
